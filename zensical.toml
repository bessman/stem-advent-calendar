[project]
site_name = "STEM Advent Calendar 2026"
site_description = "24 small science and technology adventures for curious children aged 6–9."
site_url = "https://bessman.github.io/stem-advent-calendar/"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Welcome & calendar" = "index.md" },
  { "Print mission cards" = "print-cards.md" },
  { "Overall inventory" = "inventory.md" },
  { "Week 1 — Physics & engineering" = [
    "activities/day-01.md",
    "activities/day-02.md",
    "activities/day-03.md",
    "activities/day-04.md",
    "activities/day-05.md",
    "activities/day-06.md",
  ] },
  { "Week 2 — Chemistry & sound" = [
    "activities/day-07.md",
    "activities/day-08.md",
    "activities/day-09.md",
    "activities/day-10.md",
    "activities/day-11.md",
    "activities/day-12.md",
    "activities/day-13.md",
  ] },
  { "Week 3 — Nature's hidden powers" = [
    "activities/day-14.md",
    "activities/day-15.md",
    "activities/day-16.md",
    "activities/day-17.md",
    "activities/day-18.md",
  ] },
  { "Week 4 — The inventor's workshop" = [
    "activities/day-19.md",
    "activities/day-20.md",
    "activities/day-21.md",
    "activities/day-22.md",
    "activities/day-23.md",
    "activities/day-24.md",
  ] },
]
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/mission-card.js", "javascripts/print-cards.js", "javascripts/inventory.js"]

[project.theme]
language = "en"
features = [
  "navigation.top",
  "navigation.path",
  "content.code.copy",
]

[project.theme.palette]
scheme = "default"
primary = "teal"
accent = "deep orange"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tasklist = { clickable_checkbox = true }
