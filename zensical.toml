[project]
site_name = "STEM Advent Calendar 2026"
site_description = "24 small science and technology adventures for curious children aged 6–9."
site_url = "https://bessman.github.io/stem-advent-calendar/"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Welcome & calendar" = "index.md" },
  { "Print mission cards" = "print-cards.md" },
  { "Overall inventory" = "inventory.md" },
  { "Week 1 — Physics & engineering" = [
    { "1 · Mystery Materials" = "activities/day-01.md" },
    { "2 · Sink or Float?" = "activities/day-02.md" },
    { "3 · Balloon Rocket Race" = "activities/day-03.md" },
    { "4 · The Flying Helicopter" = "activities/day-04.md" },
    { "5 · Build, Test and Improve a Bridge" = "activities/day-05.md" },
    { "6 · Chemical Balloon Inflation" = "activities/day-06.md" },
  ] },
  { "Week 2 — Chemistry & sound" = [
    { "7 · The Secret String Telephone" = "activities/day-07.md" },
    { "8 · The Bubbling Lava Lamp" = "activities/day-08.md" },
    { "9 · The Pepper Escape" = "activities/day-09.md" },
    { "10 · Walking Rainbow" = "activities/day-10.md" },
    { "11 · The Colour Detective" = "activities/day-11.md" },
    { "12 · The Great Dissolving Race" = "activities/day-12.md" },
    { "13 · The Fizzy Red-Cabbage Juice Lab" = "activities/day-13.md" },
  ] },
  { "Week 3 — Nature's hidden powers" = [
    { "14 · Wake Up, Little Seed!" = "activities/day-14.md" },
    { "15 · The Invisible Candle Snuffer" = "activities/day-15.md" },
    { "16 · The Invisible Magnet Maze" = "activities/day-16.md" },
    { "17 · Light Up an LED!" = "activities/day-17.md" },
    { "18 · Invent a Switch" = "activities/day-18.md" },
  ] },
  { "Week 4 — The inventor's workshop" = [
    { "19 · Hello, Arduino!" = "activities/day-19.md" },
    { "20 · The Magic Button" = "activities/day-20.md" },
    { "21 · The Seed Scientist Returns" = "activities/day-21.md" },
    { "22 · The Secret Light Message" = "activities/day-22.md" },
    { "23 · The Skittles Rainbow Painting" = "activities/day-23.md" },
    { "24 · The Grand Christmas Invention!" = "activities/day-24.md" },
  ] },
]
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/mission-card.js", "javascripts/print-cards.js", "javascripts/inventory.js"]

[project.theme]
language = "en"
features = [
  "navigation.top",
  "navigation.path",
  "content.code.copy",
]

[project.theme.palette]
scheme = "default"
primary = "teal"
accent = "deep orange"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tasklist = { clickable_checkbox = true }
