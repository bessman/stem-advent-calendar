[project]
site_name = "STEM Advent Calendar 2026"
site_description = "24 small science and technology adventures for curious children aged 6–9."
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Welcome & calendar" = "index.md" },
  { "Week 1 — Physics & engineering" = [
    { "1 · Mystery Materials" = "activities/day-01.md" },
    { "2 · Sink or Float?" = "activities/day-02.md" },
    { "3 · Balloon Rocket Race" = "activities/day-03.md" },
    { "4 · The Flying Helicopter" = "activities/day-04.md" },
    { "5 · Build a Bridge: Part 1" = "activities/day-05.md" },
    { "6 · Build a Bridge: Part 2" = "activities/day-06.md" },
  ] },
  { "Week 2 — Chemistry & sound" = [
    { "7 · The Secret String Telephone" = "activities/day-07.md" },
    { "8 · The Musical Water Glasses" = "activities/day-08.md" },
    { "9 · The Pepper Escape" = "activities/day-09.md" },
    { "10 · Walking Rainbow" = "activities/day-10.md" },
    { "11 · The Colour Detective" = "activities/day-11.md" },
    { "12 · The Great Dissolving Race" = "activities/day-12.md" },
    { "13 · The Colour-Changing Potion Lab" = "activities/day-13.md" },
  ] },
]
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/mission-card.js"]

[project.theme]
language = "en"
features = [
  "navigation.top",
  "navigation.path",
  "content.code.copy",
]

[project.theme.palette]
scheme = "default"
primary = "teal"
accent = "deep orange"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.superfences = {}
